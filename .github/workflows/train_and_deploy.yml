name: MLOps Train and Verify Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Model Training Pipeline
      run: |
        python train_models.py

    - name: Verify Model Artifact Exists
      run: |
        if [ -f "models/random_forest_72h.pkl" ]; then
          echo "✅ Model successfully trained and generated!"
        else
          echo "❌ Error: Model file was not generated."
          exit 1
        fi